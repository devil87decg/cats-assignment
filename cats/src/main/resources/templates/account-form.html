<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
	
<head>
	<meta charset="UTF-8">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">
	
	<title>Create Account | CATS</title>
</head>

<body>
	
	<!-- Provide a link back to the Administration page. -->
	<nav>
		<a href="/admin">Back to Adminstration</a>
	</nav>
	
	<h1>Create Login Account</h1>
	
	<p>Create an account before linking it to an employee profile.</p>
	
	<p th:if="${success}" th:text="${success}"></p>
	
	<p th:if="${error}" th:text="${error}"></p>
	
	<!-- Submit the entered account details to the controller. -->
	<form action="/admin/accounts" method="post">
		
		<p>
			<label for="username">Username</label>
			<input type="text" id="username" name="username" required>
		</p>
		
		<p>
			<label for="password">Password</label>
			<input type="password" id="password" name="password" required>
		</p>
		
		<!-- Show the account roles supplied by the controller. -->
		<p>
			<label for="role">Role</label>
			<select id="role" name="role" required>
				<option value="">Select a role</option>
				<option th:each="role : ${roles}"
					th:value="${role}"
					th:text="${role}">
				</option>
			</select>	
		</p>
		
		<button type="submit">Create account</button>
		
	</form>
	
</body>

</html>
