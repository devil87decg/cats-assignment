<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
	
	<meta charset="UTF-8">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">
	
	<title>Annual Allowances | CATS</title>
</head>

<body>
	
	<nav>
		<a href="/admin">← Administration</a>
	</nav>
	
	<h1>Annual Allowances</h1>
	
	<p>Set an employee's training allowance for a year.</p>
	
	<p th:if="${success}" th:text="${success}"></p>
	
	<p th:if="${error}" th:text="${error}"></p>
	
	<form action="/admin/allowances" method="post">
		
		<label for="emplyeeId">Employee ID</label>
		<input type="number" id="employeeId" name="employeeId" min="1" required>
			
		<label for="year">Year</label>
		<input type="number" id="year" name="year" min="2000" required>
		
		<label for="dayLimit">Training-day limit</label>
		<input type="number" id="dayLimit" name="dayLimit" min="0.5" step="0.5" required>
		
		<p>Enter 5 days for administrator staff or 10 days for professional staff.</p>
		
		<label for="feeBudget">Annual fee budget (S$)</label>
		<input type="number" id="feeBudget" name="feeBudget" min="0" step="0.01">
		
		<button type="submit">Save allowance</button>
		
	</form>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
