<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">

	<title>Annual Allowances | CATS</title>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<h1>Annual Allowances</h1>

	<p>Maintain each employee's training-day entitlement and training budget for the current year.</p>

	<div th:if="${success}" class="message message-success" th:text="${success}"></div>

	<div th:if="${error}" class="message message-error" th:text="${error}"></div>

	<!-- STEP 1: Choose employee -->
	<form th:action="@{/admin/allowances/new}" method="get">

		<label for="employeeId">Employee</label>

		<select id="employeeId" name="employeeId" required>
			<option value="">-- Select employee --</option>

			<option th:each="employee: ${employees}" th:value="${employee.id}"
				th:text="${employee.name + ' - ' + employee.staffCategory}"
				th:selected="${selectedEmployee != null and selectedEmployee.id == employee.id}"></option>
		</select>
		<button type="submit">View Allowance</button>
	</form>

	<!--STEP 2: Maintain selected employee -->
	<div th:if="${selectedEmployee != null}">
		<h2>Current Year Allowance</h2>

		<p>
			<strong>Employee:</strong>
			<span th:text="${selectedEmployee.name}"></span>
		</p>
		<p>
			<strong>Staff Category:</strong>
			<span th:text="${selectedEmployee.staffCategory}"></span>
		</p>
		<p>
			<strong>Year:</strong>
			<span th:text="${currentYear}"></span>
		</p>


		<form th:action="@{/admin/allowances}" method="post">

			<input type="hidden" name="employeeId" th:value="${selectedEmployee.id}" />

			<label for="dayLimit">Training-day Entitlement</label>
			<input type="number" id="dayLimit" name="dayLimit" min="0.5" step="0.5"
				th:value="${allowance != null ? allowance.dayLimit : ''}" required />

			<p>Default entitlement: 5 days for administrator staff and 10 days for professional staff.</p>

			<label for="feeBudget">Annual fee budget (S$)</label>
			<input type="number" id="feeBudget" name="feeBudget" min="0" step="0.01"
				th:value="${allowance != null ? allowance.feeBudget : ''}" required />

			<button type="submit">Save changes</button>

		</form>
	</div>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
