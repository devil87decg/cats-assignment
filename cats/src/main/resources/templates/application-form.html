<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
	
<head>
	
	<meta charset="UTF-8">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">
	
	<title>New Course Application | CATS</title>
</head>

<body>

	<nav>
		<a href="/">Home</a>
		<a href="/logout">Logout</a>
	</nav>
	
	<h1>New Course Application</h1>
	
	<p>Enter the course details to submit an application for approval.</p>
	
	<p th:if="${success}" th:text="${success}"></p>
	
	<p th:if="${error}" th:text="${error}"></p>
		
	<p th:text="${'Application ID: ' + courseForm.id}"></p>
	
	<!-- Submit to the create URL / update URL depending on whether an ID exists  -->
	<form th:action="${courseForm.id == null}
			? @{/applications}
			: @{/applications/{id}/update(id=${courseForm.id})}" 
			method="post" 
			th:object="${courseForm}">
	
		<p>
			<label for="courseTitle">Course title</label>
			<input type="text" id="courseTitle" th:field="*{courseTitle}" required>
		</p>	
		
		<p>
			<label for="category">Course category</label>
			<select id="category" th:field="*{category}" required>
				<option value="">Select a course category</option>
				<option th:each="category : ${categories}"
					th:value="${category}"
					th:text="${category}">
				</option>
			</select>
		</p>
		
		<p>
			<label for="trainingProvider">Training provider</label>
			<input type="text" id="trainingProvider" th:field="*{trainingProvider}">
		</p>
		
		<!-- Select the first date of the course. -->
		<p>
			<label for="startDate">Start date</label>
			<input type="date" id="startDate" th:field="*{startDate}" required>
		</p>
		
		<p>
			<label for="endDate">End date</label>
			<input type="date" id="endDate" th:field="*{endDate}" required>
		</p>
		
		<p>
			<input type="checkbox" id="halfDay" th:field="*{halfDay}">
			<label for="halfDay">Half-day session (internal training only)</label>
		</p>
		
		<p>
			<label for="fee">Course fee ($)</label>
			<input type="number" id="fee" th:field="*{fee}" min="0" step="0.01">
		</p>
		
		<p>
			<label for="justification">Justification</label>
			<textarea id="justification" th:field="*{justification}" rows="4" required></textarea>
			
		</p>
		
		<p>
			<label for="workDissemination">Work dissemination during the course (optional)</label>
			<textarea id="workDissemination" th:field="*{workDissemination}" rows="3"></textarea>
		</p>
		
		<button type="submit">Submit application</button>
		
	</form>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
