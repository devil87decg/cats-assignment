<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">
	
<head>
	
	<meta charset="UTF-8">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">
	
	<title>My Applications | CATS</title>
	
</head>
		
<body>
	
		<!-- Provide links to the home page, application form, and logout -->
		<nav>
			<a href="/">Home</a>
			<a href="/applications/new">New application</a>
			<a href="/logout">Logout</a>
		</nav>
	
		<h1>My Applications</h1>
		
		<div th:if="${success}" class="message message-success" th:text="${success}"></div>
		
		<!-- Display an error carried here after a redirect. -->		
		<div th:if="${error}" class="message message-error" th:text="${error}"></div>
			
		<!-- Display the year supplied by the controller -->
		<p th:text="'Applications for ' + ${currentYear}"></p>
		
		<!-- Show this message only when the application list is empty -->
		<p th:if="${totalItems == 0}">
		    You have no course application for this year.
		</p>
		
		<!-- Define the column headings -->
		<table th:if="${totalItems > 0}">
			<thead>
				<tr>
					<th>Course title</th>
					<th>Category</th>
					<th>Start date</th>
					<th>End date</th>
					<th>Training days</th>
					<th>Fee ($)</th>
					<th>Status</th>
					<th>Details</th>
				</tr>
			</thead>
			<!-- Repeat this row for each application in the list -->
			<tbody>
				<tr th:each="courseRequest : ${applications}">
					<td th:text="${courseRequest.courseTitle}"></td>
					<td th:text="${courseRequest.course.category.name}"></td>
					<td th:text="${courseRequest.startDate}"></td>	
					<td th:text="${courseRequest.endDate}"></td>
					<td th:text="${courseRequest.durationDays}"></td>
					<td th:text="${courseRequest.fee}"></td>
					<td th:text="${courseRequest.status}"></td>
					<td>
						<a th:href="@{/applications/{id}(id=${courseRequest.id})}">View details</a>
					</td>																					
				</tr>
			</tbody>
		</table>
		
		<!-- Pagination controls -->
		<div class="pagination-controls" th:if="${totalItems > 0}">

		    <!-- Allow employee to choose the number of applications per page -->
		    <form class="pagination-form" th:action="@{/applications}" method="get">
		        <label for="pageSize">Results per page:</label>
		        <select id="pageSize" name="size" onchange="this.form.submit()">
		            <option value="5" th:selected="${pageSize == 5}">5</option>
		            <option value="10" th:selected="${pageSize == 10}">10</option>
		            <option value="15" th:selected="${pageSize == 15}">15</option>
		        </select>
		    </form>

		    <!-- Show page navigation only when there is more than one page -->
		    <nav class="pagination-nav" th:if="${totalPages > 1}" aria-label="Application pages">

		        <ul class="pagination">

		            <!-- Previous page -->
		            <li class="page-item" th:if="${currentPage > 1}">
		                <a class="page-link"
		                   th:href="@{/applications(
		                       page=${currentPage - 1},
		                       size=${pageSize})}">
		                    Previous
		                </a>
		            </li>

		            <!-- Page numbers -->
		            <li class="page-item"
		                th:each="i : ${#numbers.sequence(1, totalPages)}"
		                th:classappend="${currentPage == i} ? 'active'">

		                <a class="page-link"
		                   th:href="@{/applications(
		                       page=${i},
		                       size=${pageSize})}"
		                   th:text="${i}">
		                    1
		                </a>
		            </li>

		            <!-- Next page -->
		            <li class="page-item" th:if="${currentPage < totalPages}">
		                <a class="page-link"
		                   th:href="@{/applications(
		                       page=${currentPage + 1},
		                       size=${pageSize})}">
		                    Next
		                </a>
		            </li>

		        </ul>
		    </nav>

		</div>
		
		<!-- Display the range of results currently shown -->
		<p class="pagination-summary" th:if="${totalItems > 0}">
		    Showing
		    <span th:text="${((currentPage - 1) * pageSize) + 1}"></span>-<span
		          th:text="${currentPage * pageSize > totalItems
		                   ? totalItems
		                   : currentPage * pageSize}"></span>
		    of
		    <span th:text="${totalItems}"></span>
			results
		</p>
		
		<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
