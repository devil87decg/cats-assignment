<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head> 
	
	<meta charset="UTF-8">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">
	
	<title>Create Employee | CATS</title>

</head>

<body>
	
	<nav>
		<a href="/admin">Administration</a>
	</nav>
	
	<h1>Create Employee</h1>
	<p>Create a login account and employee profile.</p>
	
	<!-- Display the success message when one is available. -->
	<p th:if="${success}" th:text="${success}"></p>
	
	<!-- Display the error message when one is available. -->
	<p th:if="${error}" th:text="${error}"></p>
	
	<!-- Send the entered employee profile details to /admin/employees using POST when the form is submitted. -->
	<form action="/admin/employees" method="post">
	
		<h2>Login Account</h2>

		<p>
			<label for="username">Username</label>
			<input type="text"
				   id="username"
				   name="username"
				   required>
		</p>

		<p>
			<label for="password">Password</label>
			<input type="password"
				   id="password"
				   name="password"
				   required>
		</p>

		<p>
			<label for="role">Role</label>

			<select id="role"
					name="role"
					required>

				<option value="">Select a role</option>

				<option th:each="role : ${roles}"
						th:value="${role}"
						th:text="${role}">
				</option>

			</select>
		</p>
		
		<h2>Employee Profile</h2>
	
		<!-- Enter the staff member's name for the employee profile. -->
		<p>
			<label for="name">Employee name</label>
			<input type="text" id="name" name="name" required>
		</p>
		<p>
			<label for="email">Email</label>
			<input type="email" id="email" name="email" required>
		</p>
		<p>
			<label for="designation">Desgination (optional)</label>
			<input type="text" id="designation" name="designation">
		</p>
		
		<p>
			<label for="department">Department (optional)</label>
			<input type="text" id="department" name="department">
		</p>
		
		<!-- Show the staff category choices supplied by the controller. -->
		<p>
			<label for="staffCategory">Staff category</label>
			<select id="staffCategory" name="staffCategory" required>
				<option value ="">Select a staff category</option>
				<option th:each="category : ${staffCategories}"
					th:value="${category}"
					th:text="${category}">
				</option>
			</select>
		</p>
		
		<p>
			<label for="supervisorId">Supervisor (optional)</label>

			<select id="supervisorId"
					name="supervisorId">

				<option value="">No Supervisor</option>

				<option th:each="supervisor : ${supervisors}"
						th:value="${supervisor.id}"
						th:text="${supervisor.name}">
				</option>

			</select>
		</p>
		
		<button type="submit">Create employee</button>
		
	</form>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
