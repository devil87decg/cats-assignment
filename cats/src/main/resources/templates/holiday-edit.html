<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/cats.css}">

    <title>Edit Public Holidays | CATS</title>
</head>

<body>
    <h1>Edit Public Holiday</h1>
    <p>Update an existing public holiday calendar used for training-day calculations.</p>

    <div class="navbar">
        <a th:href="@{/admin/holidays}">Back to Public Holidays</a>
        |
        <a th:href="@{/admin}">Administration</a>
        |
        <form th:action="@{/logout}" method="post"
              style="display: inline;">
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <div th:if="${error}"
         class="error-message"
         th:text="${error}">
    </div>

    <form th:action="@{/admin/holidays/{id}(id=${holiday.id})}"
          method="post">
        <p>
            <label for="date">Holiday date</label>
            <br>
            <input type="date" id="date" name="date"
                   th:value="${holiday.date}" required>
        </p>

        <p>
            <label for="name">Holiday name</label>
            <br>
            <input type="text" id="name" name="name"
                   th:value="${holiday.name}" required>
        </p>

        <p>
            <button type="submit">Save Changes</button>
            <a th:href="@{/admin/holidays}">Cancel</a>
        </p>
    </form>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
