<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/cats.css}">

    <title>Add Public Holidays | CATS</title>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

    <h1>Add Public Holiday</h1>
    <p>Add a public holiday calendar used for training-day calculations.</p>

	<div th:if="${error}"
	     class="message message-error"
	     th:text="${error}">
	</div>


    <form th:action="@{/admin/holidays}" method="post">
        <p>
            <label for="date">Holiday date</label>
            <br>
            <input type="date" id="date" name="date" required>
        </p>

        <p>
            <label for="name">Holiday name</label>
            <br>
            <input type="text" id="name" name="name" required>
        </p>

        <p>
            <button type="submit">Add Public Holiday</button>
            <a th:href="@{/admin/holidays}">Cancel</a>
        </p>
    </form>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
