<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" th:href="@{/css/cats.css}">

    <title>Public Holidays | CATS</title>
</head>

<body>
    <h1>Public Holiday Administration</h1>
    <p>
        Maintain the public holiday calendar used when calculating
        employee training days.
    </p>

    <div class="navbar">
        <a th:href="@{/admin}">Back to Administration</a>
        |
        <form th:action="@{/logout}" method="post"
              style="display: inline;">
            <button type="submit" class="logout-link">Logout</button>
        </form>
    </div>

    <p>
        <a th:href="@{/admin/holidays/new}">Add public holiday</a>
    </p>

    <div th:if="${success}"
         class="message message-success"
         th:text="${success}">
    </div>

    <div th:if="${error}"
         class="message message-error"
         th:text="${error}">
    </div>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Holiday Name</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>
            <tr th:if="${#lists.isEmpty(holidays)}">
                <td colspan="3">
                    No public holidays have been recorded.
                </td>
            </tr>

            <tr th:each="holiday : ${holidays}">
                <td th:text="${#temporals.format(holiday.date, 'dd-MMM-yyyy')}"></td>

                <td th:text="${holiday.name}"></td>

                <td class="action-column">
                    <div class="employee-actions">
                        <a th:href="@{/admin/holidays/{id}/edit(id=${holiday.id})}"
                           class="employee-action-btn employee-edit-btn">
                            Edit
                        </a>

                        <form th:action="@{/admin/holidays/{id}/delete(id=${holiday.id})}"
                              method="post"
                              style="display: inline;"
                              onsubmit="return confirm('Are you sure you want to delete this public holiday?');"
                              class="employee-delete-form">
                            <button type="submit"
                                    class="employee-action-btn employee-delete-btn">
                                Delete
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
        </tbody>
    </table>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
