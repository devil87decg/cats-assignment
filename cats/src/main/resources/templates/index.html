<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">

	<title>Home | CATS</title>
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<h1>Course Application Tracking System</h1>

	<p>Welcome to CATS.</p>

	<div th:if="${error}" class="message message-error" th:text="${error}"></div>

	<!-- Stats Cards -->
	<div class="page-wrapper">
		<section class="cards">
			<div class="number-card">
				<div class="card-title">Training Days Remaining</div>
				<div class="card-value">
					<span th:text="${remainingDays}">0</span>
				</div>
			</div>

			<div class="number-card">
				<div class="card-title">Training Budget Remaining</div>
				<div class="card-value">
					$<span th:text="${remainingFees}">0.00</span>


				</div>
				<div class="question-bubble">

				</div>
			</div>
		</section>
		<div th:replace="~{fragments/training-calendar :: trainingCalendar}"></div>
	</div>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
