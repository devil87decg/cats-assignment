<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

	<meta charset="UTF-8">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<link rel="stylesheet" th:href="@{/css/cats.css}">

	<title>Manager Applications | CATS</title>

</head>

<body>

	<nav>
		<a href="/">Home</a>
		<a href="/manager/subordinates">Subordinate course history</a>
		<form th:action="@{/logout}" method="post"
		      style="display: inline;">
		    <button type="submit" class="logout-link">Logout</button>
		</form>
	</nav>

	<h1>Pending Course Applications</h1>

	<!-- Display confirmation when a decision was saved -->
	<p th:if="${success}" th:text="${success}"></p>

	<!-- Display the reason a decision could not be saved -->
	<p th:if="${error}" th:text="${error}"></p>

	<p>Review course applications submitted by your subordinates.</p>

	<p th:if="${#lists.isEmpty(pendingApplications)}">There are no course applications awaiting your decision.</p>

	<!-- Show the table when pending applications exist -->
	<table th:if="${!#lists.isEmpty(pendingApplications)}">
		<thead>
			<tr>
				<th>Employee ID</th>
				<th>Employee</th>
				<th>Course title</th>
				<th>Category</th>
				<th>Start date</th>
				<th>End date</th>
				<th>Status</th>
				<th>Details</th>
			</tr>
		</thead>

		<tbody>
			<!-- Repeat these rows for each pending application -->
			<th:block th:each="courseRequest, row : ${pendingApplications}">

				<!-- Show a heading for the first employee and whenever the employee changes -->
				<tr th:if="${row.first or
		                courseRequest.employee.id !=
		                pendingApplications[row.index - 1].employee.id}">
					<th colspan="8" th:text="${courseRequest.employee.name}">
					</th>
				</tr>

				<!-- Display this employee's application details -->
				<tr>
					<td th:text="${courseRequest.employee.id}"></td>
					<td th:text="${courseRequest.employee.name}"></td>
					<td th:text="${courseRequest.courseTitle}"></td>
					<td th:text="${courseRequest.course != null and courseRequest.course.category != null
					    ? courseRequest.course.category.name
					    : (courseRequest.legacyCategory != null
					        ? courseRequest.legacyCategory
					        : 'Not specified')}">
					</td>
					<td th:text="${courseRequest.startDate}"></td>
					<td th:text="${courseRequest.endDate}"></td>
					<td th:text="${courseRequest.status}"></td>
					<td>
						<a th:href="@{/manager/applications/{id}(id=${courseRequest.id})}">
							Review application
						</a>
					</td>
				</tr>

			</th:block>
		</tbody>
	</table>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>

</html>
