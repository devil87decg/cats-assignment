<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          th:href="@{/css/cats.css(v=2)}">

    <title>Employee Claim History | CATS</title>

</head>

<body>

	<div th:replace="~{fragments/header :: header}"></div>


    <h1>Employee Course Fee Claim History</h1>


    <p>
        <strong>Employee:</strong>
        <span th:text="${subordinate.name}"></span>
    </p>

    <p>
        <strong>Employee ID:</strong>
        <span th:text="${subordinate.id}"></span>
    </p>


    <!-- Show which years are included -->

    <p th:if="${!allYears}"
       th:text="'Showing claims for courses in ' + ${currentYear}">
    </p>

    <p th:if="${allYears}">
        Showing claims from all years.
    </p>


    <!-- Switch between current-year and all-year history -->

    <p class="history-filter">

        <a th:href="@{/manager/subordinates/{id}/claims(
                id=${subordinate.id},
                allYears=false)}">
            Current year
        </a>

        <a th:href="@{/manager/subordinates/{id}/claims(
                id=${subordinate.id},
                allYears=true)}">
            All years
        </a>

    </p>


    <!-- Display a message when no claims exist -->

    <p th:if="${#lists.isEmpty(claimHistory)}">
        No course fee claims were found for the selected period.
    </p>


    <!-- Display claim history -->

    <div class="table-scroll"
         th:if="${!#lists.isEmpty(claimHistory)}">

        <table>

            <thead>

                <tr>
                    <th>Claim ID</th>
                    <th>Course title</th>
                    <th>Category</th>
                    <th>Course period</th>
                    <th>Claim amount (S$)</th>
                    <th>Claim date</th>
                    <th>Status</th>
                    <th>Decision date</th>
                    <th>Details</th>
                </tr>

            </thead>

            <tbody>

                <tr th:each="claim : ${claimHistory}">

                    <td th:text="${claim.id}">
                    </td>

                    <td th:text="${claim.application.courseTitle}">
                    </td>

                    <td th:text="${claim.application.course != null
                            and claim.application.course.category != null
                            ? claim.application.course.category.name
                            : (claim.application.legacyCategory != null
                            ? claim.application.legacyCategory
                            : 'Not specified')}">
                    </td>

                    <td>
                        <span th:text="${claim.application.startDate}">
                        </span>

                        to

                        <span th:text="${claim.application.endDate}">
                        </span>
                    </td>

                    <td th:text="${claim.amount}">
                    </td>

                    <td th:text="${#temporals.format(
                            claim.claimDate,
                            'dd MMM yyyy, HH:mm')}">
                    </td>

                    <td th:text="${claim.status}">
                    </td>

                    <td th:text="${claim.decisionDate != null
                            ? #temporals.format(
                                claim.decisionDate,
                                'dd MMM yyyy, HH:mm')
                            : '-'}">
                    </td>

                    <td>
                        <a th:href="@{/manager/claims/{id}
                                (id=${claim.id})}">
                            View details
                        </a>
                    </td>

                </tr>

            </tbody>

        </table>

    </div>


    <div th:replace="~{fragments/footer :: footer}">
    </div>

</body>

</html>
