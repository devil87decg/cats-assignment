<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head> 
	
	<meta charset="UTF-8">
	
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	
	<link rel="stylesheet" th:href="@{/css/cats.css}">
	
	<title>Subordinate History | CATS</title> 
	
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	
	<h1>Subordinate History</h1>

	<p>
	    Select an employee to view their course application or course fee claim history.
	</p>
	
	<!-- Show a message when the manager has no direct subordinates.-->
	<p th:if="${#lists.isEmpty(subordinates)}">
	    No employees are currently assigned to you.
	</p>

	<!-- Show the employee table when subordinates exist -->
	<table th:if="${!#lists.isEmpty(subordinates)}">

	    <thead>
	        <tr>
	            <th>Employee ID</th>
	            <th>Employee name</th>
	            <th>Staff category</th>
	            <th>Course History</th>
	            <th>Claim History</th>
	        </tr>
	    </thead>

	    <tbody>

	        <tr th:each="employee : ${subordinates}">

	            <td th:text="${employee.id}"></td>

	            <td th:text="${employee.name}"></td>

	            <td th:text="${employee.staffCategory}"></td>

	            <td>
	                <a th:href="@{/manager/subordinates/{id}/courses(
	                        id=${employee.id})}">
	                    View course history
	                </a>
	            </td>

	            <td>
	                <a th:href="@{/manager/subordinates/{id}/claims(
	                        id=${employee.id})}">
	                    View claim history
	                </a>
	            </td>

	        </tr>

	    </tbody>

	</table>
	
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>


</html>
