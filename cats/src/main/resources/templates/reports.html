<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Reports</title>
	<link rel="stylesheet" th:href="@{/css/cats.css}">
</head>

<body>

	<h1>Reports</h1>

	<p>
		View approved course attendance during a selected period.
	</p>

	<nav>
		<a th:href="@{/manager}">Home</a>
		<a th:href="@{/logout}">Logout</a>
	</nav>


	<div th:if="${error}"
		 class="message message-error"
		 th:text="${error}">
	</div>


	<main>

		<h2>Course Attendance Report</h2>

		<form method="get"
			  th:action="@{/reports}">

			<div class="form-grid">

				<p>
					<label for="startDate">
						Start Date
					</label>

					<input type="date"
						   id="startDate"
						   name="startDate"
						   th:value="${startDate}"
						   required>
				</p>


				<p>
					<label for="endDate">
						End Date
					</label>

					<input type="date"
						   id="endDate"
						   name="endDate"
						   th:value="${endDate}"
						   required>
				</p>
				
				<p>
				    <label for="categoryId">
				        Course Category
				    </label>

				    <select id="categoryId"
				            name="categoryId">

				        <option value="">
				            All Categories
				        </option>

				        <option th:each="category : ${categories}"
				                th:value="${category.id}"
				                th:text="${category.name}"
				                th:selected="${categoryId != null
				                        and category.id.equals(categoryId)}">
				        </option>

				    </select>
				</p>

			</div>

			<button type="submit">
				Generate Report
			</button>

		</form>
		
		<div th:if="${results != null}"
			 class="actions">

			<a class="button"
			   th:href="@{/reports/export(
			   		startDate=${startDate},
			   		endDate=${endDate},
			   		categoryId=${categoryId}
			   )}">
				Export CSV
			</a>

		</div>

		<div th:if="${results != null}">

			<h2>Results</h2>

			<p th:if="${#lists.isEmpty(results)}">
				No approved course applications found
				for the selected period.
			</p>


			<div class="table-scroll"
				 th:unless="${#lists.isEmpty(results)}">

				<table>

					<thead>
						<tr>
							<th>Employee</th>
							<th>Course</th>
							<th>Category</th>
							<th>Provider</th>
							<th>Start Date</th>
							<th>End Date</th>
							<th>Training Days</th>
							<th>Fee (S$)</th>
						</tr>
					</thead>

					<tbody>

						<tr th:each="courseRequest  : ${results}">

							<td th:text="${courseRequest .employee.name}">
							</td>

							<td th:text="${courseRequest .courseTitle}">
							</td>

							<td th:text="${courseRequest .course.category.name}">
							</td>

							<td th:text="${courseRequest .trainingProvider}">
							</td>

							<td th:text="${courseRequest .startDate}">
							</td>

							<td th:text="${courseRequest .endDate}">
							</td>

							<td th:text="${courseRequest .durationDays}">
							</td>

							<td th:text="${courseRequest .fee}">
							</td>

						</tr>

					</tbody>

				</table>

			</div>

		</div>

	</main>

</body>
</html>
