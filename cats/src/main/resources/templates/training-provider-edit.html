<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>Edit Training Provider | CATS</title>
	<link rel="stylesheet" th:href="@{/css/cats.css}">
</head>

<body>
	<div th:replace="~{fragments/header :: header}"></div>

	<h1>Edit Training Provider</h1>

	<p>
		Update this training provider.
	</p>

	<div th:if="${error}"
		 class="message message-error"
		 th:text="${error}">
	</div>


	<form th:action="@{/admin/training-providers/{id}(id=${provider.id})}"
		  method="post">

		<p>
			<label for="name">Provider Name</label>

			<input type="text"
				   id="name"
				   name="name"
				   th:value="${provider.name}"
				   required>
		</p>


		<p>
			<label for="description">Description</label>

			<textarea id="description"
					  name="description"
					  rows="4"
					  th:text="${provider.description}"></textarea>
		</p>


		<div class="actions">

			<button type="submit">
				Save Changes
			</button>

			<a th:href="@{/admin/training-providers}"
			   class="button button-secondary">
				Cancel
			</a>

		</div>

	</form>

</body>

</html>
